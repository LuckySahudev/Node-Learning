<!DOCTYPE html>
<html>
<head>
    <title>Form POST Demo</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Send Form Data</h2>

    <input type="text" id="name" placeholder="Enter name"><br>
    <input type="number" id="age" placeholder="Enter age"><br>

    <button onclick="sendData()">Submit</button>
</div>

<script>
function sendData(){
    const name = document.getElementById('name').value;
    const age = document.getElementById('age').value;

    const formData = `name=${name}&age=${age}`;

    fetch('http://localhost:5000/form', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: formData
    })
    .then(res => res.text())
    .then(data => alert(data));
}
</script>

</body>
</html>
